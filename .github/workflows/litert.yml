name: 🍏 LiteRT

# LiteRT iOS published as an immutable GitHub Release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: litert-release
  cancel-in-progress: false

env:
  LITERT_VERSION: "2.1.6"
  LITERT_REPO: https://github.com/google-ai-edge/LiteRT.git
  LITERT_COMMIT: 1461b6b2def31713f5c71446eab844aae05d02e9
  XCODE_VERSION: "26.1.1"

jobs:
  build-release:
    runs-on: macos-26
    timeout-minutes: 360
    defaults:
      run:
        shell: bash -eo pipefail {0}
    steps:
      - name: Check Release
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "litert-${LITERT_VERSION}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip Release
        if: steps.check.outputs.exists == 'true'
        run: echo "Release litert-${LITERT_VERSION} already exists."

      - name: Checkout Posest
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: steps.check.outputs.exists != 'true'

      - name: Xcode Select
        if: steps.check.outputs.exists != 'true'
        run: |
          sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app/Contents/Developer"
          xcode-select -p

      - name: Toolchain Versions
        if: steps.check.outputs.exists != 'true'
        run: |
          xcodebuild -version
          xcrun --show-sdk-path --sdk iphoneos

      - name: Checkout LiteRT
        if: steps.check.outputs.exists != 'true'
        env:
          LITERT_SOURCE_DIR: ${{ github.workspace }}/.build/litert-${{ env.LITERT_VERSION }}-source
          GIT_LFS_SKIP_SMUDGE: "1"
        run: |
          mkdir -p .build
          test ! -e "$LITERT_SOURCE_DIR"
          git clone \
            --branch "v${LITERT_VERSION}" \
            --depth 1 \
            --filter=blob:none \
            "${LITERT_REPO}" \
            "$LITERT_SOURCE_DIR"
          echo "LITERT_SOURCE_DIR=$LITERT_SOURCE_DIR" >> "$GITHUB_ENV"
          cd "$LITERT_SOURCE_DIR"
          git describe --tags --exact-match
          git rev-parse HEAD
          test "$(git rev-parse HEAD)" = "$LITERT_COMMIT"
          # pull Metal Accelerator dylibs
          git lfs install --local
          git lfs pull --include='litert/prebuilt/ios_arm64/libLiteRtMetalAccelerator.dylib,litert/prebuilt/ios_sim_arm64/libLiteRtMetalAccelerator.dylib'
          ls -lh litert/prebuilt/ios_arm64/libLiteRtMetalAccelerator.dylib \
            litert/prebuilt/ios_sim_arm64/libLiteRtMetalAccelerator.dylib
          file litert/prebuilt/ios_arm64/libLiteRtMetalAccelerator.dylib \
            litert/prebuilt/ios_sim_arm64/libLiteRtMetalAccelerator.dylib

      - name: Build CLiteRT
        if: steps.check.outputs.exists != 'true'
        run: |
          cd "$LITERT_SOURCE_DIR"
          bazel version
          echo "BAZEL_VERSION=$(bazel --version)" >> "$GITHUB_ENV"
          du -sh "$(bazel info output_base)" || true
          time bazel build -c opt //litert/swift:CLiteRT
          du -sh "$(bazel info output_base)"

      # - name: Test LiteRT
      #   if: steps.check.outputs.exists != 'true'
      #   run: |
      #     cd "$LITERT_SOURCE_DIR"
      #     # testMetalBuffer needs a real GPU and the runner exposes a Metal device but the GPU accelerator plugin fails to register:
      #     # <unknown>:0: error: -[litert_swift_LiteRT_Swift_Tests.TensorBufferTests testMetalBuffer] : failed: caught error: "Not found"
      #     set +e
      #     time bazel test -c opt --test_output=all //litert/swift:LiteRT_Swift_Tests >"${GITHUB_WORKSPACE}/.build/swift-test-output.log" 2>&1
      #     STATUS=$?
      #     set -e
      #     if [ $STATUS -eq 0 ]; then
      #       echo "All LiteRT Swift tests passed"
      #       exit 0
      #     fi
      #     OTHER_FAILURES=$(grep "^Test Case .* failed" "${GITHUB_WORKSPACE}/.build/swift-test-output.log" | grep -v "testMetalBuffer" || true)
      #     if [ -n "$OTHER_FAILURES" ]; then
      #       echo "LiteRT Swift tests failed beyond the known testMetalBuffer:"
      #       echo "$OTHER_FAILURES"
      #       exit 1
      #     fi
      #     grep -q "^Test Case .*testMetalBuffer.* failed" "${GITHUB_WORKSPACE}/.build/swift-test-output.log" || {
      #       echo "bazel failed without the testMetalBuffer error. See swift-test-output.log"
      #       exit 1
      #     }
      #     echo "All LiteRT Swift tests passed except know 'testMetalBuffer' failure (runner has no GPU)"

      - name: Release Artifacts
        if: steps.check.outputs.exists != 'true'
        run: |
          cd "${GITHUB_WORKSPACE}"
          ARTIFACT_DIR="${GITHUB_WORKSPACE}/.build/litert-${LITERT_VERSION}-artifacts-$(date +%Y%m%dT%H%M%S)"
          mkdir -p "$ARTIFACT_DIR"
          echo "ARTIFACT_DIR=$ARTIFACT_DIR" >> "$GITHUB_ENV"
          unzip -q "$LITERT_SOURCE_DIR/bazel-bin/litert/swift/CLiteRT.xcframework.zip" \
            -d "$ARTIFACT_DIR"
          printf '%s\n' "$ARTIFACT_DIR"
          DEVICE_CLITERT_PLIST="$ARTIFACT_DIR/CLiteRT.xcframework/ios-arm64/CLiteRT.framework/Info.plist"
          SIMULATOR_CLITERT_PLIST="$ARTIFACT_DIR/CLiteRT.xcframework/ios-arm64-simulator/CLiteRT.framework/Info.plist"
          IOS_SDK_VERSION="$(xcrun --sdk iphoneos --show-sdk-version)"
          plutil -replace CFBundleSupportedPlatforms -json '["iPhoneOS"]' "$DEVICE_CLITERT_PLIST"
          plutil -replace DTPlatformName -string iphoneos "$DEVICE_CLITERT_PLIST"
          plutil -replace DTSDKName -string "iphoneos${IOS_SDK_VERSION}" "$DEVICE_CLITERT_PLIST"
          test "$(plutil -extract CFBundleSupportedPlatforms.0 raw -o - "$DEVICE_CLITERT_PLIST")" = "iPhoneOS"
          test "$(plutil -extract DTPlatformName raw -o - "$DEVICE_CLITERT_PLIST")" = "iphoneos"
          test "$(plutil -extract DTSDKName raw -o - "$DEVICE_CLITERT_PLIST")" = "iphoneos${IOS_SDK_VERSION}"
          ! cmp -s "$DEVICE_CLITERT_PLIST" "$SIMULATOR_CLITERT_PLIST"
          # check well formed .xcframework
          plutil -p "$ARTIFACT_DIR/CLiteRT.xcframework/Info.plist"
          find "$ARTIFACT_DIR/CLiteRT.xcframework" -type f -maxdepth 5 -print
          xcrun lipo -info "$ARTIFACT_DIR/CLiteRT.xcframework/ios-arm64/CLiteRT.framework/CLiteRT"
          xcrun lipo -info "$ARTIFACT_DIR/CLiteRT.xcframework/ios-arm64-simulator/CLiteRT.framework/CLiteRT"
          CHECK_OUTPUT="$(xcrun vtool -show-build "$ARTIFACT_DIR/CLiteRT.xcframework/ios-arm64/CLiteRT.framework/CLiteRT")"
          grep -Eq 'platform[[:space:]]+IOS$' <<< "$CHECK_OUTPUT"
          CHECK_OUTPUT="$(xcrun vtool -show-build "$ARTIFACT_DIR/CLiteRT.xcframework/ios-arm64-simulator/CLiteRT.framework/CLiteRT")"
          grep -Eq 'platform[[:space:]]+IOSSIMULATOR$' <<< "$CHECK_OUTPUT"
          CHECK_OUTPUT="$(xcrun nm -gjU "$ARTIFACT_DIR/CLiteRT.xcframework/ios-arm64/CLiteRT.framework/CLiteRT")"
          grep -qx '_LiteRtStaticLinkedAcceleratorGpuDef' <<< "$CHECK_OUTPUT"
          CHECK_OUTPUT="$(xcrun nm -gjU "$ARTIFACT_DIR/CLiteRT.xcframework/ios-arm64-simulator/CLiteRT.framework/CLiteRT")"
          grep -qx '_LiteRtStaticLinkedAcceleratorGpuDef' <<< "$CHECK_OUTPUT"
          ditto -c -k --sequesterRsrc --keepParent "$ARTIFACT_DIR/CLiteRT.xcframework" "$ARTIFACT_DIR/CLiteRT.xcframework.zip"
          # check valid Mach-O binaries
          DEVICE_METAL_LIBRARY="$LITERT_SOURCE_DIR/litert/prebuilt/ios_arm64/libLiteRtMetalAccelerator.dylib"
          SIMULATOR_METAL_LIBRARY="$LITERT_SOURCE_DIR/litert/prebuilt/ios_sim_arm64/libLiteRtMetalAccelerator.dylib"
          xcrun lipo -info "$DEVICE_METAL_LIBRARY"
          xcrun lipo -info "$SIMULATOR_METAL_LIBRARY"
          CHECK_OUTPUT="$(xcrun vtool -show-build "$DEVICE_METAL_LIBRARY")"
          grep -Eq 'platform[[:space:]]+IOS$' <<< "$CHECK_OUTPUT"
          CHECK_OUTPUT="$(xcrun vtool -show-build "$SIMULATOR_METAL_LIBRARY")"
          grep -Eq 'platform[[:space:]]+IOSSIMULATOR$' <<< "$CHECK_OUTPUT"
          make_metal_framework() {
            local source_library="$1"
            local source_plist="$2"
            local framework="$3"
            local binary="$framework/LiteRTMetalAccelerator"
            mkdir -p "$framework/Headers" "$framework/Modules"
            install -m 0755 "$source_library" "$binary"
            cp "$source_plist" "$framework/Info.plist"
            plutil -replace CFBundleExecutable -string LiteRTMetalAccelerator "$framework/Info.plist"
            plutil -replace CFBundleIdentifier -string com.google.odml.litert.LiteRTMetalAccelerator "$framework/Info.plist"
            plutil -replace CFBundleName -string LiteRTMetalAccelerator "$framework/Info.plist"
            plutil -replace CFBundleShortVersionString -string "$LITERT_VERSION" "$framework/Info.plist"
            for key in BuildMachineOSBuild DTCompiler DTPlatformBuild DTPlatformName DTPlatformVersion DTSDKBuild DTSDKName DTXcode DTXcodeBuild; do
              plutil -remove "$key" "$framework/Info.plist"
            done
            chmod 0644 "$framework/Info.plist"
            /usr/bin/codesign --remove-signature "$binary" >/dev/null 2>&1 || true
            xcrun install_name_tool -id '@rpath/LiteRTMetalAccelerator.framework/LiteRTMetalAccelerator' "$binary"
            printf '%s\n' '#pragma once' > "$framework/Headers/LiteRTMetalAccelerator.h"
            printf '%s\n' \
              'framework module LiteRTMetalAccelerator {' \
              '  umbrella header "LiteRTMetalAccelerator.h"' \
              '  export *' \
              '}' \
              > "$framework/Modules/module.modulemap"
          }
          DEVICE_METAL_FRAMEWORK="$ARTIFACT_DIR/ios-arm64/LiteRTMetalAccelerator.framework"
          SIMULATOR_METAL_FRAMEWORK="$ARTIFACT_DIR/ios-arm64-simulator/LiteRTMetalAccelerator.framework"
          make_metal_framework \
            "$DEVICE_METAL_LIBRARY" \
            "$DEVICE_CLITERT_PLIST" \
            "$DEVICE_METAL_FRAMEWORK"
          make_metal_framework \
            "$SIMULATOR_METAL_LIBRARY" \
            "$SIMULATOR_CLITERT_PLIST" \
            "$SIMULATOR_METAL_FRAMEWORK"
          # bundle Metal accelerator slices as one XCFramework
          xcodebuild -create-xcframework \
            -framework "$DEVICE_METAL_FRAMEWORK" \
            -framework "$SIMULATOR_METAL_FRAMEWORK" \
            -output "$ARTIFACT_DIR/LiteRTMetalAccelerator.xcframework"
          # check well formed .xcframework
          plutil -p "$ARTIFACT_DIR/LiteRTMetalAccelerator.xcframework/Info.plist"
          find "$ARTIFACT_DIR/LiteRTMetalAccelerator.xcframework" -type f -maxdepth 5 -print
          xcrun lipo -info "$DEVICE_METAL_FRAMEWORK/LiteRTMetalAccelerator"
          xcrun lipo -info "$SIMULATOR_METAL_FRAMEWORK/LiteRTMetalAccelerator"
          test "$(xcrun otool -D "$DEVICE_METAL_FRAMEWORK/LiteRTMetalAccelerator" | tail -n 1)" = '@rpath/LiteRTMetalAccelerator.framework/LiteRTMetalAccelerator'
          test "$(xcrun otool -D "$SIMULATOR_METAL_FRAMEWORK/LiteRTMetalAccelerator" | tail -n 1)" = '@rpath/LiteRTMetalAccelerator.framework/LiteRTMetalAccelerator'
          CHECK_OUTPUT="$(xcrun nm -gjU "$DEVICE_METAL_FRAMEWORK/LiteRTMetalAccelerator")"
          grep -qx '_LiteRtAcceleratorImpl' <<< "$CHECK_OUTPUT"
          CHECK_OUTPUT="$(xcrun nm -gjU "$SIMULATOR_METAL_FRAMEWORK/LiteRTMetalAccelerator")"
          grep -qx '_LiteRtAcceleratorImpl' <<< "$CHECK_OUTPUT"
          test "$(plutil -p "$ARTIFACT_DIR/LiteRTMetalAccelerator.xcframework/Info.plist" | grep -c 'LibraryPath.*LiteRTMetalAccelerator.framework')" -eq 2
          if find "$ARTIFACT_DIR/LiteRTMetalAccelerator.xcframework" -type f -name '*.dylib' -print -quit | grep -q .; then
            echo 'LiteRTMetalAccelerator.xcframework contains a standalone dylib' >&2
            exit 1
          fi
          # zip the XCFramework for distribution. ditto preserves symlinks and resource forks (keepParent keeps the top-level folder)
          ditto -c -k --sequesterRsrc --keepParent "$ARTIFACT_DIR/LiteRTMetalAccelerator.xcframework" "$ARTIFACT_DIR/LiteRTMetalAccelerator.xcframework.zip"

      - name: Release Checksums
        if: steps.check.outputs.exists != 'true'
        run: |
          cd "$ARTIFACT_DIR"
          shasum -a 256 \
            CLiteRT.xcframework.zip \
            LiteRTMetalAccelerator.xcframework.zip | tee SHA256SUMS
          du -sh "$LITERT_SOURCE_DIR" "$ARTIFACT_DIR"
          cat > "LiteRT-${LITERT_VERSION}.json" <<EOF
          {
            "litert_version": "${LITERT_VERSION}",
            "litert_repo": "${LITERT_REPO}",
            "litert_commit": "${LITERT_COMMIT}",
            "bazel": "${BAZEL_VERSION}",
            "xcode": "$(xcodebuild -version | tr '\n' ' ')",
            "runner": "${RUNNER_OS} ${RUNNER_ARCH}",
            "artifacts": [
              "CLiteRT.xcframework.zip",
              "LiteRTMetalAccelerator.xcframework.zip"
            ]
          }
          EOF
          cat "LiteRT-${LITERT_VERSION}.json"

      - name: GitHub Release
        if: steps.check.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd "$ARTIFACT_DIR"
          shasum -a 256 \
            CLiteRT.xcframework.zip \
            LiteRTMetalAccelerator.xcframework.zip
          gh release create "litert-${LITERT_VERSION}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "LiteRT ${LITERT_VERSION} for iOS" \
            --notes "📦️ Built from ${LITERT_REPO%.git}/releases/tag/v${LITERT_VERSION}"$'\n'"📝 See LiteRT-${LITERT_VERSION}.json and verify with SHA256SUMS" \
            CLiteRT.xcframework.zip \
            LiteRTMetalAccelerator.xcframework.zip \
            "LiteRT-${LITERT_VERSION}.json" \
            SHA256SUMS
